# Alembic configuration for Data Modeling Center MVP.
# The database URL is read from application Settings (DATABASE_URL) inside
# migrations/env.py, so no connection string or secret lives in this file.

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
# SQLite ALTER TABLE support is handled via render_as_batch in env.py.

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
